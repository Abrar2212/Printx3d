services:
  - type: web
    name: printx3d
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: printx3d-db
          property: connectionString
      - key: NEXTAUTH_SECRET # signs staff login cookies
        generateValue: true
      - key: STAFF_PASSWORD # reception: order queue + STL downloads
        sync: false
      - key: ADMIN_PASSWORD # everything, incl. filaments and 3D settings
        sync: false

databases:
  - name: printx3d-db
    plan: free
    databaseName: printx3d
    user: printx3d_user

